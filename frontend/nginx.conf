server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Ojo: si un `location` define algún add_header, NO hereda los del server.
    # Por eso las cabeceras de seguridad se repiten en cada location que añade otras.

    # La API se sirve en el mismo origen (/api): sin CORS y sin exponer el puerto del backend
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 25m;  # subida de documentos (el backend limita a 20 MB)
        proxy_read_timeout 120s;   # las respuestas del LLM pueden tardar
    }

    # Archivos con hash en el nombre: se pueden cachear para siempre
    location ~* \.(?:js|css|woff2?|ico|svg|png)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # SPA: cualquier otra ruta (/chat/3, /admin/users…) la resuelve Angular
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options DENY always;
        try_files $uri $uri/ /index.html;
    }
}
